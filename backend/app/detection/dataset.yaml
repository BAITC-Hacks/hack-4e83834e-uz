# YOLOv8 dataset spec for the tiny RoadWatch fine-tuning set.
# See /backend/data/detect_dataset/ANNOTATIONS.md for how these boxes were produced
# and /model/README.md for honest limitations of a model trained on this few images.
#
# `path:` is intentionally omitted here (a committed absolute path isn't
# portable across machines) - app/detection/train.py resolves it to this
# repo's backend/data/detect_dataset at runtime before handing the spec to
# YOLO. If you invoke ultralytics directly on this file instead of via
# train.py, pass --data with an explicit path or set `path:` yourself.
train: images/train
val: images/val

names:
  0: pothole
  1: crack
  2: broken_curb
  3: faded_marking
  4: manhole  # trained class, but NOT a defect - see app/config.py's
             # NON_DEFECT_CLASSES and detector.py's _map_class_name(),
             # which recognizes and discards manhole detections rather
             # than ever creating a Defect row for one.
